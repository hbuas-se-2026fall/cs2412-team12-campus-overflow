openapi: 3.0.3
info:
  title: CampusOverflow API
  version: 0.1.0
  description: |
    CampusOverflow 后端契约（Lab 4 实现，Lab 5 前端据此生成 TypeScript 客户端）。
    统一错误响应为 `{ code, message, traceId, timestamp, path, details[] }`，前端按 `code` 分支。
servers:
  - url: /
    description: 同域部署 / Vite 开发代理（/api → localhost:8080）

paths:
  /api/v1/users:
    post:
      tags: [Users]
      operationId: registerUser
      summary: 注册账号（初始状态 pending）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: 邮箱已注册
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{id}/email-verification:
    post:
      tags: [Users]
      operationId: verifyEmail
      summary: 模拟点击邮件验证链接（pending → active）
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: 查询账号
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 账号信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/questions:
    get:
      tags: [Questions]
      operationId: listQuestions
      summary: 问题列表（按创建时间倒序分页）
      parameters:
        - name: page
          in: query
          description: 页码，从 0 开始
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: size
          in: query
          description: 每页条数（1–100）
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: tag
          in: query
          description: 按标签筛选（US-10）
          schema:
            type: string
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPageResponse'
    post:
      tags: [Questions]
      operationId: createQuestion
      summary: 发布问题
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '201':
          description: 创建成功
          headers:
            Location:
              description: 新问题详情地址
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '400':
          description: 请求校验失败 / 不变式违反（INV-Q-01、INV-Q-02、INV-U-02）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/questions/{id}:
    get:
      tags: [Questions]
      operationId: getQuestion
      summary: 问题详情
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: 问题详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/questions/{id}/acceptance:
    post:
      tags: [Questions]
      operationId: acceptAnswer
      summary: 采纳答案（仅提问者）
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAnswerRequest'
      responses:
        '200':
          description: 采纳后的问题
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        '400':
          description: 不变式违反（INV-Q-03 / INV-Q-04 / INV-Q-05）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: 标签词表（US-10，可扩展）
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/v1/answers:
    post:
      tags: [Answers]
      operationId: submitAnswer
      summary: 提交回答（US-06）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnswerRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '400':
          description: INV-A-02（问题已下架）/ INV-A-03（60 秒限流）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Answers]
      operationId: listAnswers
      summary: 某问题下的回答
      parameters:
        - name: questionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 回答列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnswerResponse'

  /api/v1/votes:
    post:
      tags: [Votes]
      operationId: castVote
      summary: 投票 / 改票（US-07，幂等）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CastVoteRequest'
      responses:
        '200':
          description: 投票结果（含目标最新票数）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteResponse'
        '400':
          description: INV-V-02（不能自投）/ INV-V-04（已下架）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Votes]
      operationId: retractVote
      summary: 撤票（幂等）
      parameters:
        - name: targetType
          in: query
          required: true
          schema:
            type: string
            enum: [question, answer]
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: voterId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已撤票

  /api/v1/comments:
    post:
      tags: [Comments]
      operationId: postComment
      summary: 发表评论（US-09）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200':
          description: 评论
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
    get:
      tags: [Comments]
      operationId: listComments
      summary: 某目标下的评论
      parameters:
        - name: targetType
          in: query
          required: true
          schema:
            type: string
            enum: [question, answer]
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 评论列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'

  /api/v1/comments/{id}:
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: 删除自己的评论（INV-C-03）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: operatorId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已删除
        '403':
          description: 不是作者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{id}/reputation:
    get:
      tags: [Reputation]
      operationId: getReputation
      summary: 用户声誉与明细（US-11）
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 声誉
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationResponse'

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CreateAnswerRequest:
      type: object
      required: [questionId, authorId, body]
      properties:
        questionId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
          maxLength: 10000

    AnswerResponse:
      type: object
      required: [id, questionId, authorId, body, status, accepted, voteCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
        status:
          type: string
          enum: [normal, hidden]
        accepted:
          type: boolean
        voteCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CastVoteRequest:
      type: object
      required: [targetType, targetId, voterId, value]
      properties:
        targetType:
          type: string
          enum: [question, answer]
        targetId:
          type: string
          format: uuid
        voterId:
          type: string
          format: uuid
        value:
          type: string
          enum: [up, down]

    VoteResponse:
      type: object
      required: [targetType, targetId, voterId, value, targetVoteCount]
      properties:
        targetType:
          type: string
          enum: [question, answer]
        targetId:
          type: string
          format: uuid
        voterId:
          type: string
          format: uuid
        value:
          type: string
          enum: [up, down]
        targetVoteCount:
          type: integer

    CreateCommentRequest:
      type: object
      required: [targetType, targetId, authorId, body]
      properties:
        targetType:
          type: string
          enum: [question, answer]
        targetId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
          maxLength: 500

    CommentResponse:
      type: object
      required: [id, targetType, targetId, authorId, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [question, answer]
        targetId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    ReputationResponse:
      type: object
      required: [userId, score, entries]
      properties:
        userId:
          type: string
          format: uuid
        score:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ReputationEntry'

    ReputationEntry:
      type: object
      required: [ruleCode, delta, occurredAt]
      properties:
        ruleCode:
          type: string
        delta:
          type: integer
        occurredAt:
          type: string
          format: date-time

    RegisterUserRequest:
      type: object
      required: [email, nickname, password]
      properties:
        email:
          type: string
          maxLength: 254
        nickname:
          type: string
          maxLength: 32
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 至少 8 位且同时包含字母与数字（INV-U-03）

    UserResponse:
      type: object
      required: [id, email, nickname, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nickname:
          type: string
        status:
          type: string
          enum: [pending, active, disabled]
        createdAt:
          type: string
          format: date-time

    CreateQuestionRequest:
      type: object
      required: [askerId, title, body]
      properties:
        askerId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 5
          maxLength: 150
        body:
          type: string
          maxLength: 20000
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            minLength: 2
            maxLength: 20
          description: 必须来自共享词表 SK-01（INV-Q-02）

    QuestionResponse:
      type: object
      required: [id, askerId, title, body, tags, status, voteCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        askerId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [open, solved, hidden]
        acceptedAnswerId:
          type: string
          format: uuid
          nullable: true
        voteCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    QuestionPageResponse:
      type: object
      required: [items, page, size, total, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuestionResponse'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
        hasNext:
          type: boolean

    AcceptAnswerRequest:
      type: object
      required: [answerId, operatorId]
      properties:
        answerId:
          type: string
          format: uuid
        operatorId:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      required: [code, message, timestamp, path]
      properties:
        code:
          type: string
          description: 稳定错误码（不变式编号，如 INV-Q-02）
        message:
          type: string
        traceId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
