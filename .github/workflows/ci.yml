name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 后端：编译 + 测试 + JaCoCo 覆盖率 + Checkstyle 质量门禁
  # Testcontainers 用例在 GitHub Actions 的 ubuntu runner 上会自动启用（有 Docker）
  # ---------------------------------------------------------------------------
  backend:
    name: backend · mvn verify（测试 + 覆盖率 + Checkstyle）
    runs-on: ubuntu-latest
    # Secrets 不能直接写在 if 里（GitHub 会认为工作流非法），先落成环境变量再判断
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn clean verify
        run: mvn -B clean verify

      - name: 上传 JaCoCo HTML 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/**'
          if-no-files-found: warn

      - name: 上传 Checkstyle 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: '**/target/checkstyle-result.xml'
          if-no-files-found: warn

      # SonarQube 是可选步骤：配置了 SONAR_TOKEN / SONAR_HOST_URL 才执行
      - name: SonarQube 扫描与质量门禁
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B sonar:sonar
          -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
          -Dsonar.qualitygate.wait=true

  # ---------------------------------------------------------------------------
  # 前端：类型检查 + ESLint + 生产构建
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Lab 8：镜像构建与推送（仅在 main 分支 push 时执行）
  # 需要 CI 通过（backend + frontend）才构建镜像，避免把坏代码推上 registry
  # ---------------------------------------------------------------------------
  images:
    name: images · docker build & push (GHCR)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像元数据（backend）
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: 构建并推送 backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 镜像元数据（frontend）
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: 构建并推送 frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---------------------------------------------------------------------------
  # Lab 8：部署到测试服务器 + smoke test
  #
  # 需要的 Secrets（Settings → Secrets and variables → Actions）：
  #   DEPLOY_HOST      测试服务器地址（IP 或域名）
  #   DEPLOY_USER      SSH 用户
  #   DEPLOY_SSH_KEY   SSH 私钥（对应公钥已加入服务器 authorized_keys）
  #   DEPLOY_PATH      服务器上的项目目录，例如 /opt/campus-overflow
  #   PUBLIC_BASE_URL  对外访问地址，例如 https://team12.example.edu.cn
  #
  # 未配置 DEPLOY_HOST 时，所有步骤自动跳过（不会因缺 Secrets 而红灯）。
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy · 服务器拉取新镜像 + 健康检查
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
    steps:
      - name: 未配置部署服务器（跳过）
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::未配置 DEPLOY_HOST，跳过部署。配置方法见 docs/lab8/部署方案.md"

      - name: SSH 部署
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull app nginx
            docker compose up -d --no-deps app nginx
            # smoke test：等就绪探针通过，最多 90 秒
            for i in $(seq 1 45); do
              if curl -fsS http://127.0.0.1/actuator/health/readiness >/dev/null 2>&1; then
                echo "readiness OK after ${i}0s"
                exit 0
              fi
              sleep 2
            done
            echo "smoke test failed, dumping logs"
            docker compose logs --tail=120 app
            exit 1

      - name: 公网 smoke test
        if: env.PUBLIC_BASE_URL != '' && env.DEPLOY_HOST != ''
        run: |
          set -eu
          curl -fsS "${{ secrets.PUBLIC_BASE_URL }}/actuator/health" | tee /dev/stderr | grep -q '"status":"UP"'
          echo "public endpoint UP: ${{ secrets.PUBLIC_BASE_URL }}"

