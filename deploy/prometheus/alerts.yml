# ============================================================================
# 告警规则（Lab 8 Step 5：至少 1 条；这里给了 4 条）
#
#   HighP95Latency  —— p95 延迟 > 500ms（实验要求的那条）
#   High5xxRate     —— 5xx 错误率 > 1%
#   InstanceDown    —— 后端抓取不到（容器挂了 / 健康检查失败）
#   HighHeapUsage   —— JVM 堆使用率 > 90%
#
# 指标名来自 Micrometer：http_server_requests_seconds_{count,bucket}、
# jvm_memory_used_bytes、jvm_memory_max_bytes。
# ============================================================================
groups:
  - name: campus-overflow-slo
    rules:
      - alert: HighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="campus-overflow"}[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: campus-overflow
        annotations:
          summary: "接口 p95 延迟超过 500ms"
          description: "当前 p95 = {{ $value | humanizeDuration }}，持续 5 分钟超过 SLO 500ms。"

      - alert: High5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="campus-overflow",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="campus-overflow"}[5m])), 0.001)
          > 0.01
        for: 5m
        labels:
          severity: critical
          team: campus-overflow
        annotations:
          summary: "5xx 错误率超过 1%"
          description: "当前 5xx 比例 = {{ $value | humanizePercentage }}，持续 5 分钟。"

      - alert: InstanceDown
        expr: up{job="campus-overflow"} == 0
        for: 2m
        labels:
          severity: critical
          team: campus-overflow
        annotations:
          summary: "后端实例不可达"
          description: "Prometheus 已连续 2 分钟抓取不到 app:8080/actuator/prometheus。"

      - alert: HighHeapUsage
        expr: |
          sum(jvm_memory_used_bytes{job="campus-overflow",area="heap"})
          /
          clamp_min(sum(jvm_memory_max_bytes{job="campus-overflow",area="heap"}), 1)
          > 0.9
        for: 10m
        labels:
          severity: warning
          team: campus-overflow
        annotations:
          summary: "JVM 堆使用率超过 90%"
          description: "当前堆使用率 = {{ $value | humanizePercentage }}，考虑扩容或排查内存泄漏。"
