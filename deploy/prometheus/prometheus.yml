# ============================================================================
# Prometheus 抓取配置（Lab 8）
# ============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: campus-overflow
    env: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: campus-overflow
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
