server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: campus-overflow

  datasource:
    # 本地默认连本机 MySQL 8；部署时用环境变量覆盖，不要把生产密码写进仓库
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_overflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      pool-name: campus-overflow-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    # schema 由 Flyway 负责，Hibernate 只做映射，不自动建表/改表
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

# 标签词表 SK-01：共享内核（问答 ↔ 发现）共同认可的标签集合。
# 新增词条要经过两个上下文同意，见 Lab 3 术语表 #13 与聚合清单 SK-01。
campus-overflow:
  tags:
    vocabulary:
      - java
      - spring-boot
      - spring-data-jpa
      - mysql
      - flyway
      - ddd
      - maven
      - junit
      - docker
      - git
      - react
      - typescript
      - 数据库
      - 算法
      - 校园生活
      - 选课
      - 考研
      - 实习
      - 保研
      - 实验室

logging:
  level:
    root: INFO
    com.campusoverflow: INFO
    org.hibernate.SQL: WARN
