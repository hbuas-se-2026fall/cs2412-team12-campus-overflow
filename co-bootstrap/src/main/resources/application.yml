server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: campus-overflow

  datasource:
    # 本地默认连本机 MySQL 8；部署时用环境变量覆盖，不要把生产密码写进仓库
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_overflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      pool-name: campus-overflow-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    # schema 由 Flyway 负责，Hibernate 只做映射，不自动建表/改表
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

# 标签词表 SK-01 从 Sprint 3（US-10）起落在数据库 tag 表：
# 初始词表见 db/migration/V2__sprint3_schema.sql，发帖时未知标签会自动登记。
# 原来写在 application.yml 里的 campus-overflow.tags.vocabulary 已移除，避免两处维护同一份词表。

logging:
  level:
    root: INFO
    com.campusoverflow: INFO
    org.hibernate.SQL: WARN
