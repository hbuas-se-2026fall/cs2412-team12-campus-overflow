server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # 部署在 Nginx 后面：信任 X-Forwarded-*，让日志与指标拿到真实客户端 IP / 协议
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
    min-response-size: 1024

spring:
  application:
    name: campus-overflow

  datasource:
    # 本地默认连本机 MySQL 8；部署时用环境变量覆盖，不要把生产密码写进仓库
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_overflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      pool-name: campus-overflow-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    # schema 由 Flyway 负责，Hibernate 只做映射，不自动建表/改表
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

# 标签词表 SK-01 从 Sprint 3（US-10）起落在数据库 tag 表：
# 初始词表见 db/migration/V2__sprint3_schema.sql，发帖时未知标签会自动登记。
# 原来写在 application.yml 里的 campus-overflow.tags.vocabulary 已移除，避免两处维护同一份词表。

logging:
  level:
    root: INFO
    com.campusoverflow: INFO
    org.hibernate.SQL: WARN

# ============================================================================
# Lab 8：监控与运维端点
#   /actuator/health            —— 健康检查（docker healthcheck 与部署 smoke test 用）
#   /actuator/health/liveness   —— 存活探针（不查数据库）
#   /actuator/health/readiness  —— 就绪探针（含 DB）
#   /actuator/prometheus        —— Prometheus 抓取入口
#   /actuator/metrics           —— 指标列表（本机排查用）
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: db,diskSpace,ping
  metrics:
    tags:
      application: campus-overflow
      env: ${DEPLOY_ENV:local}
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: CampusOverflow
    version: 0.1.0-SNAPSHOT
    description: 校园问答系统（Lab 8 上线版）
