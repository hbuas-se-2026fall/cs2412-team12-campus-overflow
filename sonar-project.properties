# ============================================================================
# SonarQube 项目配置（Lab 7 Step 3）
#
# 用法：
#   1) 启动 SonarQube（见 docker-compose.sonarqube.yml，默认 http://localhost:9000）
#   2) 生成 token 后设置环境变量 SONAR_TOKEN
#   3) mvn clean verify sonar:sonar
#
# CI（.github/workflows/ci.yml）会在 SONAR_TOKEN 存在时执行同样的命令，
# 并在 SonarQube 侧用质量门禁（Coverage > 70%、Bugs = 0、Vulnerabilities = 0）拦截合并。
# ============================================================================

sonar.projectKey=campus-overflow
sonar.projectName=CampusOverflow
sonar.projectVersion=0.1.0-SNAPSHOT

# 多模块：Sonar 会读取每个模块的 sonar 配置；这里给出源目录与测试目录
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/*.min.js,**/*.sql
sonar.tests=.

# JaCoCo 报告：各模块 target/site/jacoco/jacoco.xml（由 jacoco-maven-plugin 生成）
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Java 版本
sonar.java.source=21
sonar.java.target=21

# 质量门禁（在 SonarQube 服务端配置，这里仅作记录）
#   Coverage on New Code >= 80%
#   Overall Coverage >= 70%
#   Bugs = 0
#   Vulnerabilities = 0
#   Code Smells (new) <= 10
