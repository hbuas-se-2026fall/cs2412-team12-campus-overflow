# ============================================================================
# Nginx：静态资源 + 反向代理 + SPA fallback（Lab 8）
#
# 三个坑的规避：
#   1. /api 反代：proxy_pass 末尾不带 /，保留 /api/v1/... 原样转发；
#   2. SPA 404：try_files ... /index.html，React Router 的深链接刷新不会 404；
#   3. 真实 IP：转发 X-Forwarded-For / X-Forwarded-Proto，后端已开
#      server.forward-headers-strategy=framework。
# ============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查用（不写访问日志）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 后端 API
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 部署 smoke test 与运维排查用
    location /actuator/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带 hash 的静态资源：长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
